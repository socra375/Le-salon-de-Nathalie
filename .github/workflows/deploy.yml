name: Deploy a GitHub Pages

# Fase 7 del plan de migración: publica app/ (Vite + Svelte) en GitHub
# Pages vía Actions.
#
# Corte a producción completado: Settings → Pages → Source ya está en
# "GitHub Actions" (no "Deploy from a branch"), y el primer disparo manual
# (workflow_dispatch, corrida 35985856704) publicó bien -- confirmado con
# `actions/deploy-pages` en verde. A partir de este commit, cada push a
# `main` despliega solo.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Evita dos despliegues corriendo a la vez; no cancela uno ya en curso para
# no dejar Pages a mitad de una subida.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build app/
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Build de producción
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    name: Publicar en Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
